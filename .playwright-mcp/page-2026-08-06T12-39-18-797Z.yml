    - main [ref=e73]:
      - generic [ref=e74]:
        - heading "iPhoneを修理のためにAppleに送る" [level=1] [ref=e75]
        - paragraph [ref=e76]: Appleに修理サービス*をお申し込みいただくと、お手元の製品をAppleに返送いただくために必要な資材が入ったキットをお受け取りいただくことになります。
        - heading "iPhoneをお送りいただく前に" [level=2] [ref=e77]
        - list [ref=e78]:
          - listitem [ref=e79]:
            - paragraph [ref=e80]: iPhoneを以下の手順に従ってバックアップします。
            - list [ref=e81]:
              - listitem [ref=e82]:
                - paragraph [ref=e83]:
                  - link "iCloudでバックアップする" [ref=e84] [cursor=pointer]:
                    - /url: https://support.apple.com/ja-jp/108366
              - listitem [ref=e85]:
                - paragraph [ref=e86]:
                  - link "Macでバックアップする" [ref=e87] [cursor=pointer]:
                    - /url: https://support.apple.com/ja-jp/108366
              - listitem [ref=e88]:
                - paragraph [ref=e89]:
                  - link "Windowsパソコンでバックアップする" [ref=e90] [cursor=pointer]:
                    - /url: https://support.apple.com/ja-jp/108796
          - listitem [ref=e91]:
            - paragraph [ref=e92]:
              - text: iPhoneを消去して個人データを削除し、Apple AccountからiPhoneを削除します。それには、「設定」で「一般」>「転送またはiPhoneをリセット」をタップし、「すべてのコンテンツと設定を消去」をタップします。確認のため、Apple Accountパスワードを入力する必要があります。Apple PayでPASMOやSuicaなどの交通系ICカードをお使いの場合は、
              - link "ウォレットからカードを削除" [ref=e93] [cursor=pointer]:
                - /url: https://support.apple.com/ja-jp/108772
              - text: します。
          - listitem [ref=e94]:
            - paragraph [ref=e95]:
              - text: iPhoneで物理的なSIMカードをお使いの場合は、
              - link "SIMカードを取り出し" [ref=e96] [cursor=pointer]:
                - /url: https://support.apple.com/ja-jp/109357
              - text: て、安全な場所に保管しておきます。iPhoneでeSIMをお使いの場合は、通信事業者に問い合わせ、サービスの停止を申し込んでください。
          - listitem [ref=e97]:
            - paragraph [ref=e98]: iPhoneの電源をオフにします。
        - heading "iPhoneをAppleに送る" [level=2] [ref=e99]
        - paragraph [ref=e100]: iPhoneの集荷用の箱は、配送業者がご用意いたします。iPhoneを梱包する際は、ケース、電源アダプタ、USBケーブル、その他のアクセサリなど、ほかのものは同梱しないでください。これらのアイテムを同梱いただいても、ご返却いたしかねますので、ご了承ください。必ず、配送業者から集荷証明書を受け取ってください。iPhoneを修理サービスに出していただいたことの裏付けとなります。Appleでは、配送中の損傷については一切の責任を負いかねます。
        - paragraph [ref=e102]: "*配送修理は、国や地域によっては利用できない場合があります。"
